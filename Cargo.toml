[workspace]
members = ["./ext/inkmark"]
resolver = "2"

# panic stays on the Rust default (unwind) in every profile: magnus catches
# Rust panics at the FFI boundary and converts them to Ruby exceptions,
# which only works under panic = unwind.

[profile.dev]
opt-level     = 3
lto           = "fat"
codegen-units = 1
incremental   = false

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
debug         = true
# Keep `debug = true` for local release builds (full DWARF in target/), but
# strip DWARF from the shipped binaries. Without this, every cross-compiled
# .so/.dll carries ~30MB of DWARF per Ruby ABI — Mach-O splits DWARF into a
# separate .dSYM bundle so darwin gems never had this cost. "debuginfo" drops
# DWARF while preserving the symbol table, so panic backtraces still include
# function names (no file:line) and `perf`/flamegraphs still resolve symbols.
strip         = "debuginfo"
incremental   = false

[profile.test]
opt-level     = 3
lto           = "fat"
codegen-units = 1
incremental   = false
